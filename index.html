<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>20th ANNIVERSARY - 月あかり夢てらす</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #090a0f; overflow: hidden; }
    iframe { display: block; border: none; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!--
    GASのスタンプラリーを、この画面の中に表示するためのページです。
    （GASのURLを直接開くと上に出る「このアプリケーションは、Google ではなく…」のバナーを見せないため）

    ★ 下の GAS_URL を、GASで公開した「ウェブアプリのURL（/exec で終わるURL）」に書き換えてください。
  -->
  <iframe id="app" src="about:blank" allow="camera; clipboard-write" title="スタンプカード"></iframe>
  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyChPm8blabk99Cd1XdBsdD6SoQ7Ih72uYR0Y3QqcfCpEYpYY9u53vt4lt0L8LMh21w/exec';
    // このページのURLの「?stamp=1」などを、そのままGASに渡す（QRコードでのスタンプ用）
    document.getElementById('app').src = GAS_URL + window.location.search;
  </script>
</body>
</html>
